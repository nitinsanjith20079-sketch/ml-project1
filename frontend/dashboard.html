<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>📊 Analytics Dashboard</title>
<link rel="stylesheet" href="css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="dashboard-container">
    <header class="dash-header">
        <h1>📊 HERO RUNNER - ANALYTICS</h1>
        <a href="index.html" class="back-btn">← Back to Game</a>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Players</h3>
            <p id="total-players">0</p>
        </div>
        <div class="stat-card">
            <h3>Churn Rate</h3>
            <p id="churn-rate">0%</p>
        </div>
        <div class="stat-card">
            <h3>1-Day Retention</h3>
            <p id="retention-1">0%</p>
        </div>
        <div class="stat-card">
            <h3>7-Day Retention</h3>
            <p id="retention-7">0%</p>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-container">
            <h3>Churn Risk Distribution</h3>
            <canvas id="riskChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>Power Unlock Rates</h3>
            <canvas id="powerChart"></canvas>
        </div>
    </div>
</div>
<script src="js/dashboard.js"></script>
</body>
</html>
